name: GlobalHoldings
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "362"
targets:
  GlobalHoldings:
    type: application
    platform: iOS
    sources:
      - path: iOS/GlobalHoldings
        excludes:
          - Assets.xcassets
          - PrivacyInfo.xcprivacy
      - path: iOS/GlobalHoldings/Assets.xcassets
        buildPhase: resources
      - path: iOS/GlobalHoldings/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: iOS/GlobalHoldings/Info.plist
      properties:
        CFBundleDisplayName: "أصول ونفوذ"
        GHEdition: "development"
        CFBundleIconName: "AppIcon"
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "362"
        GHSourceSnapshotSHA256: "1aabc60a2ec818129984f5dcf9dd5b80db9b7328919f978871f6602acea9f7c1"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchStoryboardName: LaunchScreen
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Assets & Influence Update"
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.bdran.globalholdings.update
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bdran.globalholdings.update
            UTTypeDescription: "Assets & Influence Update"
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - saneiupdate
                - ghupdate
              public.mime-type: application/x-globalholdings-update
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.globalholdings
        PRODUCT_NAME: GlobalHoldings
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    scheme:
      testTargets: []
    postBuildScripts:
      - name: Copy WebApp Files
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/WebApp"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRCROOT/WebApp/." "$DEST/"
