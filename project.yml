name: GlobalHoldings
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "362"
targets:
  GlobalHoldings:
    type: application
    platform: iOS
    sources:
      - path: iOS/GlobalHoldings
        excludes:
          - Assets.xcassets
      - path: iOS/GlobalHoldings/Assets.xcassets
        buildPhase: resources
    info:
      path: iOS/GlobalHoldings/Info.plist
      properties:
        CFBundleDisplayName: "VENTORA"
        GHEdition: "development"
        CFBundleIconName: "AppIcon"
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "362"
        GHSourceSnapshotSHA256: "5d0c897ab9857c1ac90010050fde6eb76b6f68ab78fe959876b8d32de853001c"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchStoryboardName: LaunchScreen
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: "VENTORA Update"
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.bdran.globalholdings.update
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.bdran.globalholdings.update
            UTTypeDescription: "VENTORA Update"
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - saneiupdate
                - ghupdate
              public.mime-type: application/x-globalholdings-update
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.globalholdings
        PRODUCT_NAME: GlobalHoldings
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    scheme:
      testTargets: []
    postBuildScripts:
      - name: Copy WebApp Files
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/WebApp"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRCROOT/WebApp/." "$DEST/"
