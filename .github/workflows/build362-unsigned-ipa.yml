name: Diagnose bounded purchase sync (no IPA)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: purchase-sync-profile
  cancel-in-progress: false
jobs:
  purchase-sync:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install pinned browser host
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund
          npx playwright install chromium
      - name: Execute original purchase gate with finite sync spans
        run: node tools/diagnose_purchase_sync.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purchase-sync-profile
          path: .ci-output/
