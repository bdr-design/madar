name: Diagnose committed render progress (no IPA)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-commit-proof
  cancel-in-progress: false
jobs:
  render-proof:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Install pinned browser host
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund
          npx playwright install chromium webkit
      - name: Run two original and two committed-progress samples
        run: |
          mkdir -p .ci-output
          for proof in 0 1; do
            for sample in 1 2; do
              status=0
              GH_RENDER_COMMIT_PROOF="$proof" node tools/diagnose_render_commit.cjs > ".ci-output/render-$proof-$sample.log" 2>&1 || status=$?
              printf '%s\n' "$status" > ".ci-output/render-$proof-$sample.exit"
              tail -n 14 ".ci-output/render-$proof-$sample.log"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-commit-proof
          path: .ci-output/
          include-hidden-files: true
