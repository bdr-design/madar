name: Node crash probe on macOS (diagnostic only)

# Runs 70 and 71 of the Build 362 workflow stopped on Node exiting with -11 (SIGSEGV) in build391-hospitality-core and
# build396-hospitality-budgets, about 0.4 s in, with an empty log; on Linux the same Node passes them every time. This
# workflow repeats those tests on the same macOS runner and Node, with V8 subsystems switched off one at a time, and
# prints the faulting thread of each macOS crash report. It builds nothing and is not an acceptance gate.

on:
  # A workflow that is not on the default branch cannot be dispatched; a push that changes this file runs it.
  push:
    paths:
      - .github/workflows/node-crash-probe.yml
  workflow_dispatch:
    inputs:
      rounds:
        description: Runs of each test per variant
        required: false
        default: "80"

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Count crashes per Node runtime
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds || '80' }}
        run: |
          # Probe 2 caught the crash under lldb and in six crash reports, always the same: a full GC requested in a
          # Sparkplug function's out-of-line prologue (Runtime_StackGuardWithGap) reads the untagged value 0xf in that
          # InternalFrame as a pointer (ClearStaleLeftTrimmedPointerVisitor, address 0xe). This compares runtimes on the
          # same runner: the current Node, the current Node without Sparkplug, and the newest Node 24 and 26 releases.
          # GitHub runs bash with -e; a crashed run must be counted, not end the step.
          set +e -uo pipefail
          out="$RUNNER_TEMP/probe";mkdir -p "$out/node"
          export GH_TEST_SOURCE_DIR="$GITHUB_WORKSPACE"
          uname -m;sysctl -n machdep.cpu.brand_string
          for version in 24.22.0 26.12.0;do
            curl -fsSL "https://nodejs.org/dist/v$version/node-v$version-darwin-arm64.tar.gz" | tar xz -C "$out/node" || echo "download failed: $version"
          done
          runtimes=("$(command -v node)|" "$(command -v node)|--no-sparkplug" "$out/node/node-v24.22.0-darwin-arm64/bin/node|" "$out/node/node-v26.12.0-darwin-arm64/bin/node|")
          for runtime in "${runtimes[@]}";do
            bin="${runtime%%|*}";extra="${runtime#*|}";[[ -x "$bin" ]] || { echo "missing $bin";continue; }
            for case in "tests/build391-hospitality-core.cjs|--no-turbofan" "tests/build391-hospitality-core.cjs|" "tests/build396-hospitality-budgets.cjs|";do
              test="${case%%|*}";read -r -a flags <<<"$extra ${case#*|}"
              crashed=0;failed=0
              for i in $(seq 1 "$ROUNDS");do
                "$bin" ${flags[@]+"${flags[@]}"} "$test" >/dev/null 2>"$out/last.err";code=$?
                if (( code >= 128 ));then crashed=$((crashed+1));elif (( code != 0 ));then failed=$((failed+1));cp "$out/last.err" "$out/failed-$(basename "$test").err";fi
              done
              echo "node=$("$bin" --version) flags=[${flags[*]-}] test=$test rounds=$ROUNDS crashed=$crashed failed=$failed" | tee -a "$out/summary.txt"
            done
          done
          rm -rf "$out/node";exit 0

      - name: Print the faulting thread of each crash report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'probe';out.mkdir(exist_ok=True)
          reports=[]
          for folder in (Path.home()/'Library/Logs/DiagnosticReports',Path('/Library/Logs/DiagnosticReports')):
              if folder.is_dir():reports+=[path for path in folder.rglob('node*') if path.is_file()]
          reports.sort(key=lambda path:path.stat().st_mtime)
          print(f'{len(reports)} node crash report(s)')
          for report in reports[-8:]:
              shutil.copy2(report,out/report.name)
              text=report.read_text(errors='replace');print('=====',report.name)
              try:
                  body=json.loads(text.split('\n',1)[1]);images=body.get('usedImages',[])
                  print('process',body.get('procPath'),'exception',json.dumps(body.get('exception')))
                  thread=next((t for t in body.get('threads',[]) if t.get('triggered')),None) or body['threads'][body.get('faultingThread',0)]
                  print('thread',thread.get('name') or thread.get('queue') or '',thread.get('id'))
                  for frame in thread.get('frames',[])[:18]:
                      image=images[frame['imageIndex']].get('name','?') if 'imageIndex' in frame and frame['imageIndex']<len(images) else '?'
                      print(f"  {image}  {frame.get('symbol','?')}+{frame.get('symbolLocation',frame.get('imageOffset'))}")
              except Exception as error:print('unparsed',error);print(text[:6000])
          PY

      - name: Keep the probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-crash-probe
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
          retention-days: 14
