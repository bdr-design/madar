name: Node crash probe on macOS (diagnostic only)

# Runs 70 and 71 of the Build 362 workflow stopped on Node exiting with -11 (SIGSEGV) in build391-hospitality-core and
# build396-hospitality-budgets, about 0.4 s in, with an empty log; on Linux the same Node passes them every time. This
# workflow repeats those tests on the same macOS runner and Node, with V8 subsystems switched off one at a time, and
# prints the faulting thread of each macOS crash report. It builds nothing and is not an acceptance gate.

on:
  # A workflow that is not on the default branch cannot be dispatched; a push that changes this file runs it.
  push:
    paths:
      - .github/workflows/node-crash-probe.yml
  workflow_dispatch:
    inputs:
      rounds:
        description: Runs of each test per variant
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Count crashes per V8 variant
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds || '30' }}
        run: |
          # GitHub runs bash with -e; a crashed run must be counted, not end the step.
          set +e -uo pipefail
          out="$RUNNER_TEMP/probe";mkdir -p "$out"
          export GH_TEST_SOURCE_DIR="$GITHUB_WORKSPACE"
          node --version;uname -m;sysctl -n machdep.cpu.brand_string
          codesign -dv --entitlements - "$(command -v node)" 2>&1 | head -20
          for variant in default --no-turbofan --no-maglev "--no-turbofan --no-maglev"; do
            read -r -a flags <<<"${variant/default/}"
            for test in tests/build391-hospitality-core.cjs tests/build396-hospitality-budgets.cjs tests/build392-hospitality-links.cjs tests/build393-hospitality-financial-safety.cjs; do
              crashed=0;failed=0
              for i in $(seq 1 "$ROUNDS"); do
                node ${flags[@]+"${flags[@]}"} "$test" >/dev/null 2>"$out/last.err";code=$?
                if (( code >= 128 ));then crashed=$((crashed+1));elif (( code != 0 ));then failed=$((failed+1));cp "$out/last.err" "$out/failed-${variant// /_}-$(basename "$test").err";fi
              done
              echo "variant=$variant test=$test rounds=$ROUNDS crashed=$crashed failed=$failed" | tee -a "$out/summary.txt"
            done
          done
          exit 0

      - name: Catch one crash under the debugger and name its code
        shell: bash
        run: |
          set +e -uo pipefail
          out="$RUNNER_TEMP/probe";mkdir -p "$out"
          export GH_TEST_SOURCE_DIR="$GITHUB_WORKSPACE"
          # A copy signed ad hoc with get-task-allow can be launched by lldb; the release binary's hardened runtime refuses it.
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict><key>com.apple.security.get-task-allow</key><true/></dict></plist>' >"$out/debug.plist"
          cp "$(command -v node)" "$out/node-debug" && codesign --force --sign - --entitlements "$out/debug.plist" "$out/node-debug"
          for variant in --no-turbofan default; do
            read -r -a flags <<<"${variant/default/}"
            for test in tests/build391-hospitality-core.cjs tests/build396-hospitality-budgets.cjs; do
              for i in $(seq 1 25); do
                log="$out/code-$(basename "$test" .cjs)-${variant}-$i.log"
                perl -e 'alarm shift;exec @ARGV' 180 lldb --batch -o "process handle SIGSEGV -s true -p false" -o run \
                  -k "thread backtrace -c 40" -k "register read pc lr sp fp x0 x1 x2 x3 x4 x5 x16 x17" -k "image lookup -a \$pc" -k "disassemble -s \$pc-48 -c 24" -k "process kill" -k quit \
                  -- "$out/node-debug" ${flags[@]+"${flags[@]}"} --log-code --logfile="$log" --no-logfile-per-isolate "$test" >"$out/lldb.txt" 2>&1
                if grep -qE "EXC_BAD_ACCESS|signal SIGSEGV|EXC_BAD_INSTRUCTION" "$out/lldb.txt";then
                  echo "===== crash: variant=$variant test=$test attempt=$i";grep -vE "^\s*$" "$out/lldb.txt" | grep -v "^(lldb) run" | head -150
                  cp "$out/lldb.txt" "$out/crash-lldb-${variant}-$(basename "$test" .cjs).txt"
                  python3 - "$out/lldb.txt" "$log" <<'PY'
          import re,sys
          text=open(sys.argv[1],errors='replace').read();m=re.search(r'\bpc = (0x[0-9a-f]+)',text)
          if not m:print('no pc');raise SystemExit
          pc=int(m.group(1),16);best=None
          try:
              for line in open(sys.argv[2],errors='replace'):
                  if not line.startswith('code-creation,'):continue
                  parts=line.rstrip('\n').split(',')
                  try:start=int(parts[4],16);size=int(parts[5])
                  except (ValueError,IndexError):continue
                  if start<=pc<start+size:best=parts
          except FileNotFoundError:print('no code log');raise SystemExit
          print('pc',hex(pc),'is in',('code '+' | '.join(best[1:3]+[best[6] if len(best)>6 else ''])) if best else 'no logged code object (C++ or unlogged)')
          PY
                  break
                fi
              done
            done
          done
          ls "$out" | head -40;exit 0

      - name: Print the faulting thread of each crash report
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'probe';out.mkdir(exist_ok=True)
          reports=[]
          for folder in (Path.home()/'Library/Logs/DiagnosticReports',Path('/Library/Logs/DiagnosticReports')):
              if folder.is_dir():reports+=[path for path in folder.rglob('node*') if path.is_file()]
          reports.sort(key=lambda path:path.stat().st_mtime)
          print(f'{len(reports)} node crash report(s)')
          for report in reports[:6]:
              shutil.copy2(report,out/report.name)
              text=report.read_text(errors='replace');print('=====',report.name)
              try:
                  body=json.loads(text.split('\n',1)[1]);images=body.get('usedImages',[])
                  print('exception',json.dumps(body.get('exception')),'termination',json.dumps(body.get('termination')))
                  thread=next((t for t in body.get('threads',[]) if t.get('triggered')),None) or body['threads'][body.get('faultingThread',0)]
                  print('thread',thread.get('name') or thread.get('queue') or '',thread.get('id'))
                  for frame in thread.get('frames',[])[:48]:
                      image=images[frame['imageIndex']].get('name','?') if 'imageIndex' in frame and frame['imageIndex']<len(images) else '?'
                      print(f"  {image}  {frame.get('symbol','?')}+{frame.get('symbolLocation',frame.get('imageOffset'))}")
              except Exception as error:print('unparsed',error);print(text[:6000])
          PY

      - name: Keep the probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-crash-probe
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
          retention-days: 14
