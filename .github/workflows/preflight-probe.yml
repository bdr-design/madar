name: Preflight probe on macOS (diagnostic only)

# Builds 89, 90 and 91 each stopped at build576-presentation-rest-browser on a different claim, one claim a build,
# build 92 at build558, build 93 at build487 (the probes after it failed build575 and build570) and build 94 at build576
# and, re-run, build358-fleet-engine-thread: the Build 362 workflow stops at the first failed gate, so each run showed
# one weakness and hid the next. This workflow runs the
# first 24 preflight gates of ACCEPTANCE_POLICY.json (the
# gates that failed, then those the latest fixes touch, then those that passed), the gates whose tests changed several
# times each, on the same macOS runner and Node, without stopping at a failure, and prints every result with its
# measurements. It builds nothing and is not an acceptance gate. Since build 96 it runs the browser gates (and the gates
# that read Git history: the four company-type weight gates, build584 and build585) of the preflight's front instead of
# its first 24 gates, which are now Node gates.

on:
  # A workflow that is not on the default branch cannot be dispatched; a push that changes this file or build576 runs it.
  push:
    branches: ["claude/madar-ventora-handover-3.0.0-stg723"]
    paths:
      - .github/workflows/preflight-probe.yml
      - tests/build576-presentation-rest-browser.cjs
      - tests/build487-route-pages-browser.cjs
      - tests/build575-conference-keynote-weight-browser.cjs
      - tests/build570-documents-list-weight-browser.cjs
      - tests/build558-investor-card-load-browser.cjs
      - tests/build372-asset-purchase-app-browser.cjs
      - tests/build358-staged-day-browser.cjs
      - tests/build374-diagnostic-lifecycle-browser.cjs
      - tests/build359-sliced-save-browser.cjs
      - tests/build358-fleet-engine-thread-browser.cjs
      - tests/build359-save-policy-browser.cjs
      - tests/build379-financial-posting-browser.cjs
      - tests/build530-durable-alert-defer-browser.cjs
      - tests/build579-defined-types-platform-weight.cjs
      - tests/build580-company-types-money-weight.cjs
      - tests/build581-fleet-definition-weight.cjs
      - tests/build582-directory-type-weight.cjs
      - tests/build584-summary-one-in-flight.cjs
      - tests/build585-save-upload-block-accounting.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          # build576 and other gates read earlier source files from Git history.
          fetch-depth: 0

      - name: Select Node 24
        uses: actions/setup-node@v4
        with:
          # The Build 362 workflow's Node; 24.19.0 crashed on the arm64 runner (see node-crash-probe.yml).
          node-version: "24.22.0"

      - name: Install pinned test dependencies and browser engines
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm install --no-save --package-lock=false --no-audit --no-fund
          npx playwright install chromium webkit

      - name: Run the first preflight gates, the changed ones several times, without stopping
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,sys,time
          from pathlib import Path
          root=Path('.').resolve();sys.path.insert(0,str(root/'tools'))
          from acceptance_contract import contract
          pre=[list(row) for row in contract(root)['preflight_commands']]
          # The preflight's front holds the gates the latest changes added or touched, up to build358-fleet-engine-thread
          # (touched by build 96, failed before build 95). Its browser gates are the ones the macOS runner and WebKit can
          # fail where this machine cannot; the four company-type weight gates, build584 and build585 read Git history. Each runs once, the
          # browser gates whose tests build 96 changed twice.
          last=['node','tests/build358-fleet-engine-thread-browser.cjs']
          if last not in pre:raise SystemExit('build358-fleet-engine-thread-browser left the preflight')
          front=pre[:pre.index(last)+1]
          picked=[row for row in front if row[1].endswith('-browser.cjs') or row[1] in ('tests/build579-defined-types-platform-weight.cjs','tests/build580-company-types-money-weight.cjs','tests/build581-fleet-definition-weight.cjs','tests/build582-directory-type-weight.cjs','tests/build584-summary-one-in-flight.cjs','tests/build585-save-upload-block-accounting.cjs')]
          repeat={'tests/build570-documents-list-weight-browser.cjs':3,'tests/build379-financial-posting-browser.cjs':2,'tests/build530-durable-alert-defer-browser.cjs':2,'tests/build374-diagnostic-lifecycle-browser.cjs':2,'tests/build359-save-policy-browser.cjs':2,'tests/build358-fleet-engine-thread-browser.cjs':2}
          jobs=[(f'{row[1]} run {i}' if repeat.get(row[1],1)>1 else row[1],row) for row in picked for i in range(1,repeat.get(row[1],1)+1)]
          print(f'PROBE PLAN: {len(jobs)} runs of {len(picked)} gates from the first {len(front)} preflight gates',flush=True)
          failed=[]
          for label,argv in jobs:
              started=time.monotonic()
              try:
                  run=subprocess.run(argv,cwd=root,capture_output=True,text=True,timeout=300);code=run.returncode;out=run.stdout+run.stderr
              except subprocess.TimeoutExpired as error:
                  code='timeout';out=error.stdout.decode(errors='replace') if isinstance(error.stdout,bytes) else (error.stdout or '')
              if code!=0:failed.append(label)
              print(f'PROBE {label}: exit={code} seconds={time.monotonic()-started:.1f}',flush=True)
              for line in out.splitlines():
                  if line.startswith('{"suite"') or 'AssertionError' in line or line.lstrip().startswith(('Error','TypeError','TimeoutError')):print('   '+line[:12000],flush=True)
          print(f'PROBE DONE: {len(failed)} of {len(jobs)} failed: {failed}',flush=True)
          sys.exit(1 if failed else 0)
          PY
